name: test

on:
  push:
  pull_request:

jobs:
  crew:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install falkordb fastapi uvicorn pytest
      - name: Test against FalkorDB
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "6379"
        run: pytest -q
